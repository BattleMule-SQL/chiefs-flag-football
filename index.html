<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Page</title>
  <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <button id="lang-toggle" class="lang-toggle" type="button">Español</button>
      <div class="badge" aria-hidden="true">🏈</div>
      <h1 id="team-name"></h1>
      <p id="team-league" class="league"></p>
    </div>
  </header>

  <main class="wrap">
    <section id="next-up" class="card next" hidden></section>

    <nav class="tabs" aria-label="Sections">
      <a href="#announcements" data-i18n="announcements">Announcements</a>
      <a href="#schedule" data-i18n="schedule">Schedule</a>
      <a href="#fields" data-i18n="fields">Fields</a>
    </nav>

    <section id="announcements">
      <h2 data-i18n="announcements">Announcements</h2>
      <div id="announcement-list" class="stack"></div>
    </section>

    <section id="schedule">
      <h2 data-i18n="schedule">Schedule</h2>
      <div class="record" id="record"></div>
      <div id="schedule-list" class="stack"></div>
    </section>

    <section id="fields">
      <h2 data-i18n="fieldLocations">Field Locations</h2>
      <div id="field-list" class="grid"></div>
      <div id="map-list" class="stack maps"></div>
    </section>
  </main>

  <footer class="wrap footer">
    <p id="team-contact"></p>
  </footer>

  <script src="data.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
